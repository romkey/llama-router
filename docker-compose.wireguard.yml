# WireGuard sidecar + llama-router in one network namespace (Linux hosts recommended).
#
# Usage:
#   docker compose -f docker-compose.wireguard.yml up -d
#
# Configure the tunnel in the dashboard (WireGuard tab). llama-router writes
# wg0.conf to the shared volume; the sidecar applies it with wg-quick.
#
# Publish UDP 51820 and HTTP ports on the `wireguard` service only (not on
# llama-router), because llama-router uses network_mode: service:wireguard.

services:
  wireguard:
    # Published by GitHub Actions to GHCR (see .github/workflows/ci.yml).
    # Override for forks: image: ghcr.io/<owner>/<repo>-wireguard:latest
    image: ghcr.io/romkey/llama-router-wireguard:latest
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
    ports:
      - "51820:51820/udp"
      - "80:80"
      - "8080:8080"
      - "11434:11434"
      - "9200:9200"
    volumes:
      - wireguard-conf:/etc/wireguard
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:80/health >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  llama-router:
    build: .
    network_mode: "service:wireguard"
    depends_on:
      - wireguard
    volumes:
      - llama-router-data:/app/data
      - wireguard-conf:/shared/wireguard
    environment:
      LLAMA_ROUTER_DATABASE_PATH: /app/data/llama_router.db
      LLAMA_ROUTER_CACHE_DIR: /app/data/model_cache
      LLAMA_ROUTER_WIREGUARD_CONFIG_PATH: /shared/wireguard/wg0.conf
      # LLAMA_ROUTER_CACHE_EXTERNAL_HOST: 10.8.0.1
    restart: unless-stopped

volumes:
  llama-router-data:
  wireguard-conf:
