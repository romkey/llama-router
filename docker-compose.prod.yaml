# Production: runs the released image from ghcr.io. Configure it in .env
# next to this file (see .env.example and docs/configuration.md).
#
#   docker compose -f docker-compose.prod.yaml up -d
#   APP_VERSION=1.2.3 docker compose -f docker-compose.prod.yaml up -d   # pin a release
#   docker compose -f docker-compose.prod.yaml build   # build the image locally instead
#
# Other llama-routers can dial in as workers over a WebSocket at
# ws://<host>:11434/worker/ws (put TLS in front of it for use over the
# internet); workers need no inbound ports. See docs/workers.md.

services:
  llama-router:
    image: ghcr.io/romkey/llama-router:${APP_VERSION:-latest}
    build:
      context: .
      target: production
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "80:80"         # dashboard
      - "8080:8080"     # OpenAI-compatible API
      - "9200:9200"     # Ollama registry cache
      - "11434:11434"   # Ollama API and worker links
    volumes:
      - llama-router-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:80/healthz', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Least privilege: nothing to write but /app/data and /tmp, no
    # capabilities. Docker lets unprivileged processes bind port 80.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  llama-router-data:
