# Lint, format, type and secret checks. The same hooks run three ways:
#   docker compose -f docker-compose.lint.yaml run --rm lint   # nothing to install
#   uvx pre-commit install                                     # on every git commit
#   .github/workflows/lint.yaml                                # CI
# Renovate keeps the revs current.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # uv.lock matches pyproject.toml.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.6
    hooks:
      - id: uv-lock

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.25
    hooks:
      - id: actionlint
        # Bundled so workflow shell is checked locally exactly as in CI.
        additional_dependencies: [shellcheck-py==0.11.0.1]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.15.1
    hooks:
      - id: hadolint

  # Secrets (RULES.md §7). gitleaks checks staged changes for tokens and
  # keys; CI and the lint compose file's secrets service scan the history.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # Type-checks against the locked dependencies, so it runs in the
      # project's environment rather than an isolated hook environment.
      - id: mypy
        name: mypy (strict)
        entry: uv run --locked mypy
        language: unsupported
        types_or: [python, pyi]
        pass_filenames: false
      - id: env-example
        name: .env.example lists every variable the app reads
        entry: scripts/check-env-example.py
        language: python
        pass_filenames: false
        files: ^(src/.*\.py|\.env\.example)$
      - id: env-secrets
        name: no values from .env in committed files
        entry: scripts/check-env-secrets.py
        language: python
        types: [text]
