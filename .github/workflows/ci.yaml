name: CI

# Always runs, so the required "CI passed" check always reports (a
# path-filtered workflow that doesn't run blocks the PR forever). Docs-only
# changes skip the tests and image build instead.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Find changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.find.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # to diff against the base
      - id: find
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Skip tests and the image build when only docs or the license
          # changed. Manual runs always build.
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ] \
            && ! git diff --name-only "$BASE" HEAD | grep -qvE '(\.md$|^docs/|^LICENSE$)'; then
            echo "::notice::Only docs changed; skipping tests and image build"
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  tests:
    name: Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # uv installs the Python in .python-version and the locked
      # dependencies; its cache makes that take seconds.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      # One chain of migrations: two heads means two branches each added one.
      - name: Check for a single Alembic head
        run: |
          heads=$(uv run --locked alembic -c src/llama_router/alembic.ini heads)
          echo "$heads"
          if [ "$(echo "$heads" | wc -l)" -ne 1 ]; then
            echo "::error::Alembic has more than one head; chain the migrations"
            exit 1
          fi
      - run: uv run --locked pytest -n auto
      # The sdist and wheel build, and pip can install the wheel and run it:
      # what `pip install` users and the PyPI release get.
      - name: Build and pip-install the package
        run: |
          uv build
          uv venv --seed "$RUNNER_TEMP/pip-test"
          "$RUNNER_TEMP/pip-test/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/pip-test/bin/llama-router" --version

  # The suite again against each server database the router supports. The
  # tests share the one database, so they run one at a time; the SQLite job
  # above checks coverage.
  databases:
    name: Tests (${{ matrix.db }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: postgres
            image: postgres:17-alpine
            port: 5432
            health: pg_isready -U postgres
            url: postgresql+asyncpg://postgres:ci@127.0.0.1:5432/llama_router
          - db: mysql
            image: mysql:8.4
            port: 3306
            health: mysqladmin ping -h 127.0.0.1 -pci
            url: mysql+asyncmy://root:ci@127.0.0.1:3306/llama_router
    services:
      db:
        image: ${{ matrix.image }}
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: llama_router
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: llama_router
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
        options: >-
          --health-cmd "${{ matrix.health }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      LLAMA_ROUTER_TEST_DATABASE_URL: ${{ matrix.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra ${{ matrix.db }}
      - run: uv run --locked --extra ${{ matrix.db }} pytest --no-cov

  image:
    name: Production image
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: ci/app:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      # Layers are cached in GitHub's cache, so an unchanged lockfile skips
      # the dependency install. The cache is an optimization: a failed
      # export (e.g. "failed to reserve cache") must not fail CI.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          target: production
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
      - name: Smoke test
        run: docker run --rm "$IMAGE" llama-router --version

  # The one required status check: job names may change, so branch
  # protection requires this instead.
  passed:
    name: CI passed
    if: always()
    needs: [changes, tests, databases, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "::error::A CI job finished with '$result'"; exit 1 ;;
            esac
          done
