services:
  test:
    build:
      context: .
      target: base
    command: sh -c "pip install '.[dev]' && black --check src/ tests/ && pytest -v"
    volumes:
      - .:/app
    working_dir: /app

  # A mock OpenID Connect provider for trying dashboard single sign-on.
  # Its login form accepts any subject and any claims JSON. See README,
  # "Single sign-on (OpenID Connect)".
  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    profiles: ["oidc"]
    ports:
      - "18080:8080"
    environment:
      JSON_CONFIG: '{"interactiveLogin": true}'
