# Every lint, format, type and secret check, as CI runs them, with nothing
# installed but Docker.
#
#   docker compose -f docker-compose.lint.yaml run --rm lint
#   docker compose -f docker-compose.lint.yaml run --rm secrets   # whole git history
#
# Or run the same checks on every commit: uvx pre-commit install

services:
  # Runs .pre-commit-config.yaml: ruff, mypy, yamllint, actionlint,
  # hadolint, gitleaks...
  lint:
    build:
      dockerfile_inline: |
        FROM ghcr.io/astral-sh/uv:0.13.6-python3.14-trixie-slim
        RUN apt-get update \
         && apt-get install -y --no-install-recommends git \
         && rm -rf /var/lib/apt/lists/* \
         && git config --system --add safe.directory '*'
    environment:
      # mypy's environment lives in the cache volume, not in your .venv.
      UV_PROJECT_ENVIRONMENT: /root/.cache/lint-venv
    volumes:
      - .:/project
      - lint-cache:/root/.cache
    working_dir: /project
    command: uvx pre-commit@4.7.0 run --all-files --show-diff-on-failure

  # Scans every commit in the git history for secrets, like CI does.
  secrets:
    image: ghcr.io/gitleaks/gitleaks:v8.30.1
    volumes:
      - .:/project
    command: git /project --redact --verbose

volumes:
  lint-cache:
