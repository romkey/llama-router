# WireGuard (optional)
# To use WireGuard from this container, llama-router needs access to the host network.
# On Linux, uncomment network_mode below. On macOS/Windows Docker Desktop,
# run llama-router directly on the host instead.
#
#   network_mode: host
#
# You may also need elevated network privileges:
#
#   cap_add:
#     - NET_ADMIN
#
# Install WireGuard tools on the host, e.g. apt install wireguard-tools

services:
  llama-router:
    build: .
    ports:
      - "80:80"
      - "8080:8080"
      - "9200:9200"
      - "11434:11434"
    volumes:
      - llama-router-data:/app/data
    environment:
      LLAMA_ROUTER_DATABASE_PATH: /app/data/llama_router.db
      LLAMA_ROUTER_CACHE_DIR: /app/data/model_cache
      # Set this to the IP/hostname your Ollama backends can reach this host on
      # LLAMA_ROUTER_CACHE_EXTERNAL_HOST: 192.168.1.50
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:80/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  llama-router-data:
