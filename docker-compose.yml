# Hub and worker links: other llama-routers dial in to this one over a WebSocket
# at ws://<host>:11434/worker/ws (put TLS in front of it for use over the
# internet). Workers need no inbound ports. Set LLAMA_ROUTER_API_ON_DASHBOARD_PORT
# below to serve the APIs and worker links on port 80 as well. To run this instance as a worker,
# set LLAMA_ROUTER_WORKER_HUB_URL and LLAMA_ROUTER_WORKER_TOKEN below or use the
# dashboard Workers tab.

services:
  llama-router:
    build: .
    ports:
      - "80:80"
      - "8080:8080"
      - "9200:9200"
      - "11434:11434"
    volumes:
      - llama-router-data:/app/data
    environment:
      LLAMA_ROUTER_DATABASE_PATH: /app/data/llama_router.db
      LLAMA_ROUTER_CACHE_DIR: /app/data/model_cache
      # Also serve the Ollama/OpenAI APIs and worker links on port 80 (11434
      # and 8080 keep listening). Require API keys before exposing port 80.
      # LLAMA_ROUTER_API_ON_DASHBOARD_PORT: "true"
      # Run as a worker of another hub (token comes from that hub's Workers tab):
      # LLAMA_ROUTER_WORKER_HUB_URL: https://llm.example.org
      # LLAMA_ROUTER_WORKER_TOKEN: lrw_...
      # Set this to the IP/hostname your Ollama backends can reach this host on
      # LLAMA_ROUTER_CACHE_EXTERNAL_HOST: 192.168.1.50
      #
      # Hugging Face downloads (Models tab). Variables are passed to the hf CLI
      # as-is; uncomment the ones you need (an empty HF_ENDPOINT breaks the
      # client, so leave unused ones commented). Downloads go to /app/data/hf_models.
      # HF_TOKEN: hf_...
      # HF_ENDPOINT: https://hf-mirror.example.org
      # HF_DEBUG: "1"
      # HF_HUB_DOWNLOAD_TIMEOUT: "60"
      # HF_XET_HIGH_PERFORMANCE: "1"
      # HTTPS_PROXY: http://proxy.example:3128
      #
      # Forgotten dashboard password: delete all dashboard user rows, restart, then
      # open the UI (no login until you add a user under Users). If you changed
      # LLAMA_ROUTER_DATABASE_PATH, use that path instead of /app/data/llama_router.db.
      #   docker compose exec llama-router python -c "import sqlite3; c=sqlite3.connect('/app/data/llama_router.db'); c.execute('DELETE FROM dashboard_users'); c.commit(); c.close()"
      #   docker compose restart llama-router
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:80/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  llama-router-data:
