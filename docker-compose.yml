# WireGuard (optional)
# Image must include wireguard-tools. Add NET_ADMIN so wg-quick can create wg0
# inside the container:
#
#   cap_add:
#     - NET_ADMIN
#
# If remote peers only need to reach llama-router (and backends) inside this
# container, publish WireGuard UDP and set dashboard "Public endpoint" to
# <host>:51820 (or your mapped port):
#
#   ports:
#     - "51820:51820/udp"
#
# Use host network instead if you want the tunnel IP and ports on the host
# stack (simpler when other machines must use the VPN like bare metal):
#
#   network_mode: host
#
# Docker Desktop (macOS/Windows): prefer running on a Linux host/VM or legacy
# volume mode; kernel networking differs from Linux.
#
# In the dashboard, keep each peer's AllowedIPs to their tunnel /32 so remote
# peers cannot reach your LAN through WireGuard unless you add those routes.

services:
  llama-router:
    build: .
    ports:
      - "80:80"
      - "8080:8080"
      - "9200:9200"
      - "11434:11434"
    volumes:
      - llama-router-data:/app/data
    environment:
      LLAMA_ROUTER_DATABASE_PATH: /app/data/llama_router.db
      LLAMA_ROUTER_CACHE_DIR: /app/data/model_cache
      # Set this to the IP/hostname your Ollama backends can reach this host on
      # LLAMA_ROUTER_CACHE_EXTERNAL_HOST: 192.168.1.50
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:80/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  llama-router-data:
