# WireGuard in Docker (Linux): UDP publish + NET_ADMIN + TUN device so wg-quick
# can bring up wg0 inside the container. In the dashboard, set "Public endpoint"
# to <host-or-IP>:51820 (or whatever you map HostPort:51820 below).
#
# Docker Desktop (macOS/Windows): kernel networking differs; use a Linux host/VM
# or host network mode if you need a real tunnel.
#
# Alternative: network_mode: host (drop custom port mappings; use host ports).
#
# In the dashboard, keep each peer's AllowedIPs to their tunnel /32 unless you
# intend to expose LAN routes.
#
# Every router must enable the tunnel on the WireGuard tab: turn ON "Enable
# WireGuard", set Address/Listen port/Endpoint, and have a private key (Generate
# or paste). Peering only adds DB peers; without that, wg0.conf is a comment stub
# and nothing listens. The config file name is wg0.conf (not wg0).

services:
  llama-router:
    build: .
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    ports:
      - "80:80"
      - "8080:8080"
      - "9200:9200"
      - "11434:11434"
      - "51820:51820/udp"
    volumes:
      - llama-router-data:/app/data
      - llama-router-wg:/shared/wireguard
    environment:
      LLAMA_ROUTER_DATABASE_PATH: /app/data/llama_router.db
      LLAMA_ROUTER_CACHE_DIR: /app/data/model_cache
      LLAMA_ROUTER_WIREGUARD_CONFIG_PATH: /shared/wireguard/wg0.conf
      LLAMA_ROUTER_WIREGUARD_ENABLED: "true"
      # Set this to the IP/hostname your Ollama backends can reach this host on
      # LLAMA_ROUTER_CACHE_EXTERNAL_HOST: 192.168.1.50
      #
      # Forgotten dashboard password: delete all dashboard user rows, restart, then
      # open the UI (no login until you add a user under Users). If you changed
      # LLAMA_ROUTER_DATABASE_PATH, use that path instead of /app/data/llama_router.db.
      #   docker compose exec llama-router python -c "import sqlite3; c=sqlite3.connect('/app/data/llama_router.db'); c.execute('DELETE FROM dashboard_users'); c.commit(); c.close()"
      #   docker compose restart llama-router
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:80/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  llama-router-data:
  llama-router-wg:
