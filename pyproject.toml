[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llama-router"
version = "0.15.5"
description = "An Ollama router that aggregates multiple Ollama backends behind a single API"
requires-python = ">=3.11"
dependencies = [
    "cryptography",
    "itsdangerous>=2.0",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "aiosqlite",
    "alembic>=1.13",
    "sqlalchemy[asyncio]>=2.0",
    "jinja2",
    "pydantic",
    "pydantic-settings",
    "python-multipart",
    "sentry-sdk[fastapi]",
]

[project.optional-dependencies]
postgres = [
    "asyncpg",
    "psycopg[binary]",
]
mysql = [
    "asyncmy",
    "pymysql",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-httpx",
    "black",
    "httpx",
]

[project.scripts]
llama-router = "llama_router.__main__:main"
llama-router-migrate-sqlite-pg = "llama_router.migrate_sqlite_to_postgres:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py311"]
