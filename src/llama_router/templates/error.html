{% extends "base.html" %}
{% block title %}{{ status_code }} {{ reason }} - llama-router{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h2 class="h4 mb-3"><i class="bi bi-exclamation-triangle me-2"></i>{{ status_code }} {{ reason }}</h2>
                <p class="mb-4">{{ detail }}</p>
                <a class="btn btn-primary" href="{{ back_url }}"><i class="bi bi-arrow-left me-1"></i>Back to the dashboard</a>
                {% if not dash_user and status_code in (401, 403) %}
                <a class="btn btn-outline-secondary ms-2" href="/login">Sign in</a>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
