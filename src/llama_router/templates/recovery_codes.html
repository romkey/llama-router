<div id="recovery-panel" class="alert alert-warning" hidden>
    <h2 class="h5">Save your recovery codes</h2>
    <p>Keep these somewhere safe, separate from your password. Each code works once, after entering your password. They will not be shown again.</p>
    <pre id="recovery-codes" class="user-select-all"></pre>
    <div class="d-flex flex-wrap gap-2 mb-3">
        <button type="button" id="recovery-copy" class="btn btn-sm btn-outline-dark"><i class="bi bi-clipboard me-1" aria-hidden="true"></i><span>Copy</span></button>
        <button type="button" id="recovery-download" class="btn btn-sm btn-outline-dark"><i class="bi bi-download me-1" aria-hidden="true"></i>Download</button>
    </div>
    <a id="security-continue" class="btn btn-primary" href="/profile">I've saved my codes — continue</a>
</div>
